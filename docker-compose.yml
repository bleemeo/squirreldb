version: '3'

services:
  clickhouse:
    # Pinned to a tested release, see docs/clickhouse-cluster.md.
    image: clickhouse/clickhouse-server:26.8.15.10
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=squirreldb
      - CLICKHOUSE_USER=squirreldb
      - CLICKHOUSE_PASSWORD=password
    labels:
      # Glouton is the monitoring agent made by Bleemeo.
      # On real setup of SquirrelDB, you probably want to monitor this component, but
      # this docker compose is a quick-start used to test and evaluate SquirrelDB, so
      # monitoring is disabled to avoid false notifications.
      glouton.enable: "false"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
  squirreldb:
    image: bleemeo/squirreldb
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    ports:
      - 127.0.0.1:9201:9201
    environment:
      - SQUIRRELDB_BACKEND=clickhouse
      - SQUIRRELDB_CLICKHOUSE_ADDRESSES=clickhouse:9000
      - SQUIRRELDB_CLICKHOUSE_DATABASE=squirreldb
      - SQUIRRELDB_CLICKHOUSE_USERNAME=squirreldb
      - SQUIRRELDB_CLICKHOUSE_PASSWORD=password

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    volumes:
      - ./examples/prometheus/sample-prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090
  node:
    image: prom/node-exporter
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    volumes:
      - /:/rootfs:ro,rslave
    command: --path.rootfs=/rootfs
  grafana:
    image: grafana/grafana
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./examples/prometheus/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=password
    ports:
      - 127.0.0.1:3000:3000

volumes:
  clickhouse-data: {}
  grafana-data: {}
