services:
  cassandra1:
    image: cassandra
    restart: unless-stopped
    cap_add:
      - CAP_SYS_NICE # Cassandra use mbind on NUMA system
    labels:
      # Glouton is the monitoring agent made by Bleemeo.
      # On real setup of SquirrelDB, you probably want to monitor component, but
      # this docker compose is a quick-start used to test and evaluate SquirrelDB so disable
      # monitoring to avoid false notification.
      glouton.enable: "false"
    environment:
      - "MAX_HEAP_SIZE=128M"
      - "HEAP_NEWSIZE=24M"
      - "CASSANDRA_SEEDS=cassandra1,cassandra2"
  cassandra2:
    image: cassandra
    restart: unless-stopped
    cap_add:
      - CAP_SYS_NICE # Cassandra use mbind on NUMA system
    labels:
      glouton.enable: "false"
    environment:
      - "MAX_HEAP_SIZE=128M"
      - "HEAP_NEWSIZE=24M"
      - "CASSANDRA_SEEDS=cassandra1,cassandra2"
  cassandra3:
    image: cassandra
    restart: unless-stopped
    cap_add:
      - CAP_SYS_NICE # Cassandra use mbind on NUMA system
    labels:
      glouton.enable: "false"
    environment:
      - "MAX_HEAP_SIZE=128M"
      - "HEAP_NEWSIZE=24M"
      - "CASSANDRA_SEEDS=cassandra1,cassandra2"

  redis1:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis2:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis3:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis4:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis5:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis6:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_node_start
        target: /srv/redis-files/redis-node-start.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-node-start.sh" ]
  redis_init:
    image: redis:7
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    configs:
      - source: redis_cluster_init
        target: /srv/redis-files/redis-cluster-init.sh
      - source: redis_config
        target: /srv/redis-files/redis.conf
    command: [ "/bin/sh", "/srv/redis-files/redis-cluster-init.sh" ]

  squirreldb1:
    image: bleemeo/squirreldb
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    environment:
      - SQUIRRELDB_CASSANDRA_ADDRESSES=cassandra1:9042,cassandra2:9042
      - SQUIRRELDB_CASSANDRA_REPLICATION_FACTOR=3
      - SQUIRRELDB_REDIS_ADDRESSES=redis1:6379,redis2:6379
      - SQUIRRELDB_BACKEND=cassandra
  squirreldb2:
    image: bleemeo/squirreldb
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    environment:
      - SQUIRRELDB_CASSANDRA_ADDRESSES=cassandra1:9042,cassandra2:9042
      - SQUIRRELDB_CASSANDRA_REPLICATION_FACTOR=3
      - SQUIRRELDB_REDIS_ADDRESSES=redis1:6379,redis2:6379
      - SQUIRRELDB_BACKEND=cassandra

  squirreldb:
    image: nginx
    labels:
      glouton.enable: "false"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:9201:9201

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    volumes:
      - ./sample-prometheus.yml:/etc/prometheus/prometheus.yml:ro
  node:
    image: prom/node-exporter
    restart: unless-stopped
    labels:
      glouton.enable: "false"
    volumes:
      - /:/rootfs:ro,rslave
    command: --path.rootfs=/rootfs
  grafana:
    image: grafana/grafana
    labels:
      glouton.enable: "false"
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000


configs:
  redis_config:
    content: |
      cluster-enabled yes
      cluster-require-full-coverage no
      cluster-node-timeout 15000
      cluster-config-file /data/nodes.conf
      cluster-migration-barrier 1
      appendonly yes
      protected-mode no
  redis_cluster_init:
    file: ./redis-scripts/redis-cluster-init.sh
  redis_node_start:
    file: ./redis-scripts/redis-node-start.sh
